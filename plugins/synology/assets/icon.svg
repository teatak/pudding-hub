<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Vibrant Synology tech-blue gradient -->
    <linearGradient id="syno-nas-bg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <!-- Soft chassis drop shadow -->
    <filter id="nas-shadow" x="14" y="18" width="100" height="96" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#022859" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#syno-nas-bg)"/>

  <!-- Top Ambient Highlight Curve -->
  <path d="M28 2C13.64 2 2 13.64 2 28C2 31.8 2.8 35.4 4.3 38.6C12.8 17.8 33.2 3 57 3H71C94.8 3 115.2 17.8 123.7 38.6C125.2 35.4 126 31.8 126 28C126 13.64 114.36 2 100 2H28Z" fill="#FFFFFF" fill-opacity="0.18"/>

  <!-- NAS Chassis Group with Shadow -->
  <g filter="url(#nas-shadow)">
    <!-- Main Chassis Frame (Pure high-contrast crisp white) -->
    <rect x="22" y="24" width="84" height="80" rx="14" fill="#FFFFFF"/>

    <!-- Status & Control Header Panel -->
    <rect x="29" y="31" width="70" height="12" rx="6" fill="#F1F5F9"/>

    <!-- Power / Status Indicator LED -->
    <circle cx="37" cy="37" r="4.5" fill="#22C55E" fill-opacity="0.25"/>
    <circle cx="37" cy="37" r="2.5" fill="#22C55E"/>

    <!-- LAN / Network LEDs -->
    <circle cx="47" cy="37" r="2" fill="#0EA5E9"/>
    <circle cx="55" cy="37" r="2" fill="#0EA5E9"/>

    <!-- USB / Copy Button outline on the right -->
    <rect x="85" y="34.5" width="8" height="5" rx="1.5" fill="#CBD5E1"/>

    <!-- Drive Bay Console Enclosure (Deep contrast chassis cavity) -->
    <rect x="29" y="47" width="70" height="50" rx="8" fill="#0F172A"/>

    <!-- Drive Bay 1 -->
    <rect x="34" y="52" width="18" height="40" rx="4" fill="#1E293B"/>
    <rect x="36.5" y="56" width="13" height="24" rx="2" fill="#334155"/>
    <circle cx="43" cy="61" r="1.5" fill="#4ADE80"/>
    <rect x="39" y="85" width="8" height="3" rx="1.5" fill="#64748B"/>

    <!-- Drive Bay 2 -->
    <rect x="55" y="52" width="18" height="40" rx="4" fill="#1E293B"/>
    <rect x="57.5" y="56" width="13" height="24" rx="2" fill="#334155"/>
    <circle cx="64" cy="61" r="1.5" fill="#4ADE80"/>
    <rect x="60" y="85" width="8" height="3" rx="1.5" fill="#64748B"/>

    <!-- Drive Bay 3 -->
    <rect x="76" y="52" width="18" height="40" rx="4" fill="#1E293B"/>
    <rect x="78.5" y="56" width="13" height="24" rx="2" fill="#334155"/>
    <circle cx="85" cy="61" r="1.5" fill="#4ADE80"/>
    <rect x="81" y="85" width="8" height="3" rx="1.5" fill="#64748B"/>
  </g>
</svg>
