id: synology
name: Synology NAS
version: 1.1.0
description: Access Synology DiskStation Manager (DSM) File Station to list shares, browse directories, search files, inspect metadata, and download files through the Web API.
auth:
  required: false
  methods:
    - id: account-login
      type: session
      label: Account sign-in
      default: true
      session:
        endpoint: synology_webapi
        path: /entry.cgi
        encoding: form
        inputs:
          - { id: account, label: Account, required: true }
          - { id: password, label: Password, required: true, secret: true }
          - { id: otp_code, label: Verification code, secret: true }
        parameters:
          api: SYNO.API.Auth
          version: "6"
          method: login
          session: FileStation
          format: sid
          enable_syno_token: "yes"
        body_fields:
          account: account
          passwd: password
          otp_code: otp_code
        success_field: success
        error_code_field: error.code
        challenges:
          "403": [otp_code]
          "404": [otp_code]
        outputs:
          sid: data.sid
          synotoken: data.synotoken
        account_input: account
    - id: manual
      type: none
      label: Existing session token
connection:
  fields:
    - id: sid
      label: Session Token (sid)
      description: Synology DSM session ID or API token. Automatically injected as the _sid query parameter into every File Station API request.
      placeholder: e.g. 7qU-A8a_xxxxxx
      required: true
      secret: true
      inject:
        - target: query
          name: _sid
    - id: synotoken
      label: SynoToken
      description: CSRF protection token returned by DSM when enabled.
      secret: true
      inject:
        - target: query
          name: SynoToken
    - id: account
      label: Account name
      description: Optional username for displaying connection identity and multi-NAS selection.
      placeholder: e.g. admin
      required: false
icon:
  svg: assets/icon.svg
endpoints:
  synology_webapi:
    kind: rest
    url: http://synology.local:5000/webapi
    url_config:
      label: Synology NAS Web API address
      description: Base URL of your Synology DSM Web API (e.g. http://192.168.1.100:5000/webapi or https://nas.example.com:5001/webapi).
      placeholder: http://192.168.1.100:5000/webapi
      required: true
    description: Synology DSM File Station REST Web API.
skills:
  - skills/file-station/SKILL.md
