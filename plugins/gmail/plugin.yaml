id: gmail
name: Gmail
version: 1.0.0-preview.2
description: Search and read Gmail messages, view threads and labels, and send emails and replies through a connected account.
auth:
  required: true
  methods:
    - id: google-oauth
      type: oauth2
      provider: gmail
      label: Google OAuth
      default: true
icon:
  svg: assets/icon.svg
  background:
    light: "#FFFFFF"
    dark: "#202124"
endpoints:
  gmail_rest:
    kind: rest
    url: https://gmail.googleapis.com/gmail/v1
    description: Gmail REST API.
skills:
  - skills/mailbox/SKILL.md
