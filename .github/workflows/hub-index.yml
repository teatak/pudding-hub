name: Hub index
on:
  pull_request:
    paths: ['index.json', 'scripts/validate-index.mjs', 'contracts/hub.mjs', '.github/workflows/hub-index.yml']
  push:
    branches: [main]
    paths: ['index.json', 'extensions/**/registry.json', 'scripts/validate-index.mjs', 'contracts/hub.mjs', '.github/workflows/hub-index.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/validate-index.mjs
