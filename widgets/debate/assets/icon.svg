<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 皇家靛蓝/紫圆角底板 -->
  <rect width="128" height="128" rx="24" fill="#4F46E5"/>
  
  <!-- 背景微弱思辨声波圆环 -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- 蓝方对话气泡 (正方 · 立论) -->
  <g filter="drop-shadow(0 4px 8px rgba(0,0,0,0.15))">
    <path d="M24 30 C24 24 28 20 34 20 H78 C84 20 88 24 88 30 V56 C88 62 84 66 78 66 H50 L34 78 V66 H34 C28 66 24 62 24 56 Z" fill="#38BDF8"/>
    <!-- 观点线条 -->
    <rect x="36" y="32" width="38" height="4.5" rx="2.25" fill="#FFFFFF"/>
    <rect x="36" y="42" width="28" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="36" y="52" width="20" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.85"/>
  </g>

  <!-- 红方对话气泡 (反方 · 攻辩反驳) -->
  <g filter="drop-shadow(0 6px 12px rgba(0,0,0,0.25))">
    <path d="M104 98 C104 104 100 108 94 108 H50 C44 108 40 104 40 98 V72 C40 66 44 62 50 62 H78 L94 50 V62 H94 C100 62 104 66 104 72 Z" fill="#FB7185"/>
    <!-- 反驳线条 -->
    <rect x="52" y="74" width="38" height="4.5" rx="2.25" fill="#FFFFFF"/>
    <rect x="52" y="84" width="28" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="52" y="94" width="18" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.85"/>
  </g>

  <!-- 中间思辨交锋火花星芒 (思想碰撞之光) -->
  <g transform="translate(64, 64)">
    <path d="M0 -14 Q0 0 -14 0 Q0 0 0 14 Q0 0 14 0 Q0 0 0 -14 Z" fill="#FBBF24"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>
</svg>