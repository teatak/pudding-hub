<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Vibrant Royal / Tech Blue Gradient -->
    <linearGradient id="syno-files-bg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="folder-front-grad" x1="20" y1="46" x2="108" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <!-- Soft depth shadow -->
    <filter id="folder-shadow" x="12" y="24" width="104" height="84" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#0F172A" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#syno-files-bg)"/>

  <!-- Top Ambient Highlight Curve -->
  <path d="M28 2C13.64 2 2 13.64 2 28C2 31.8 2.8 35.4 4.3 38.6C12.8 17.8 33.2 3 57 3H71C94.8 3 115.2 17.8 123.7 38.6C125.2 35.4 126 31.8 126 28C126 13.64 114.36 2 100 2H28Z" fill="#FFFFFF" fill-opacity="0.18"/>

  <!-- Folder & Storage Group with Shadow -->
  <g filter="url(#folder-shadow)">
    <!-- Folder Back Tab -->
    <path d="M24 40C24 35.58 27.58 32 32 32H51C53.8 32 56.5 33.3 58.2 35.5L62.2 40.5C63.9 42.7 66.6 44 69.4 44H96C100.42 44 104 47.58 104 52V88C104 92.42 100.42 96 96 96H32C27.58 96 24 92.42 24 88V40Z" fill="#93C5FD" fill-opacity="0.55"/>

    <!-- Document Sheet peeking out -->
    <rect x="36" y="38" width="56" height="30" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
    <line x1="44" y1="46" x2="68" y2="46" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="52" x2="58" y2="52" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Folder Front Cover (Crisp pure white modern card) -->
    <path d="M22 50C22 45.58 25.58 42 30 42H98C102.42 42 106 45.58 106 50V90C106 94.42 102.42 98 98 98H30C25.58 98 22 94.42 22 90V50Z" fill="url(#folder-front-grad)"/>

    <!-- NAS Storage Bays Badge (Centered on the folder) -->
    <rect x="38" y="55" width="52" height="34" rx="6" fill="#0F172A"/>

    <!-- Drive Slot 1 -->
    <rect x="43" y="59" width="11" height="26" rx="2.5" fill="#1E293B"/>
    <circle cx="48.5" cy="64" r="1.3" fill="#4ADE80"/>
    <rect x="46" y="79" width="5" height="2" rx="1" fill="#64748B"/>

    <!-- Drive Slot 2 -->
    <rect x="58.5" y="59" width="11" height="26" rx="2.5" fill="#1E293B"/>
    <circle cx="64" cy="64" r="1.3" fill="#4ADE80"/>
    <rect x="61.5" y="79" width="5" height="2" rx="1" fill="#64748B"/>

    <!-- Drive Slot 3 -->
    <rect x="74" y="59" width="11" height="26" rx="2.5" fill="#1E293B"/>
    <circle cx="79.5" cy="64" r="1.3" fill="#4ADE80"/>
    <rect x="77" y="79" width="5" height="2" rx="1" fill="#64748B"/>
  </g>
</svg>
