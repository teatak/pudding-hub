<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="feltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 绿绒布台面底板 -->
  <rect width="128" height="128" rx="28" fill="url(#feltGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- 台面弧形装饰线 -->
  <path d="M 16 96 A 56 56 0 0 1 112 96" fill="none" stroke="#047857" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- 第一张牌：黑桃 A (倾斜 -12 度) -->
  <g transform="translate(38, 52) rotate(-14)" filter="url(#cardShadow)">
    <rect x="-24" y="-36" width="48" height="72" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <!-- 黑桃标志 -->
    <path d="M0 -14 C-5 -7 -12 2 -7 8 C-3 12 0 10 0 14 C0 10 3 12 7 8 C12 2 5 -7 0 -14 Z" fill="#0F172A"/>
    <text x="-18" y="-20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A">A</text>
    <text x="-19" y="-8" font-family="Arial, sans-serif" font-size="9" fill="#0F172A">♠</text>
  </g>

  <!-- 第二张牌：红桃 J / 10 (倾斜 12 度) -->
  <g transform="translate(74, 56) rotate(12)" filter="url(#cardShadow)">
    <rect x="-24" y="-36" width="48" height="72" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <!-- 红桃标志 -->
    <path d="M0 -6 C-3 -14 -12 -12 -12 -5 C-12 3 0 11 0 15 C0 11 12 3 12 -5 C12 -12 3 -14 0 -6 Z" fill="#DC2626"/>
    <text x="-19" y="-20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#DC2626">J</text>
    <text x="-19" y="-8" font-family="Arial, sans-serif" font-size="9" fill="#DC2626">♥</text>
  </g>

  <!-- 前景筹码 (金色 21 筹码) -->
  <g transform="translate(86, 94)" filter="url(#cardShadow)">
    <circle cx="0" cy="0" r="18" fill="url(#goldGrad)" stroke="#B45309" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#78350F" text-anchor="middle">21</text>
  </g>
</svg>
