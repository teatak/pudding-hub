<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- 背景底板 -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- 外围罗盘刻度圈 -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#1E293B" stroke-width="6"/>
  <circle cx="64" cy="64" r="46" fill="#0B0F17" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2"/>

  <!-- 四象限彩色微光点 (代表不同思考帽：白、黄、黑/红、绿) -->
  <!-- 北：蓝帽统筹 -->
  <circle cx="64" cy="26" r="4" fill="#38BDF8"/>
  <!-- 东：黄帽收益 -->
  <circle cx="102" cy="64" r="4" fill="#FBBF24"/>
  <!-- 南：红/黑帽审慎与直觉 -->
  <circle cx="64" cy="102" r="4" fill="#F43F5E"/>
  <!-- 西：绿帽创新 -->
  <circle cx="26" cy="64" r="4" fill="#10B981"/>

  <!-- 罗盘轻网格十字线 -->
  <line x1="64" y1="32" x2="64" y2="96" stroke="#1E293B" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="32" y1="64" x2="96" y2="64" stroke="#1E293B" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- 罗盘中心星芒/指针 -->
  <g transform="rotate(28 64 64)">
    <!-- 北向决策指针 (科技蓝) -->
    <polygon points="64,28 72,64 64,61 56,64" fill="url(#needleNorth)"/>
    <!-- 南向收益指针 (智慧金) -->
    <polygon points="64,100 72,64 64,67 56,64" fill="url(#needleSouth)"/>
    <!-- 东向绿羽 (对策) -->
    <polygon points="100,64 64,56 67,64 64,72" fill="#10B981" opacity="0.9"/>
    <!-- 西向白羽 (事实) -->
    <polygon points="28,64 64,56 61,64 64,72" fill="#E2E8F0" opacity="0.9"/>
  </g>

  <!-- 核心轴心与高光 -->
  <circle cx="64" cy="64" r="8" fill="#0F172A" stroke="#E2E8F0" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="3.5" fill="#38BDF8"/>
</svg>
