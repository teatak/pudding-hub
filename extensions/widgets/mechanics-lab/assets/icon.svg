  </g>
  <!-- Gravity Vector G (Vertical Down) -->
  <path d="M50 56V86M50 86L45 80M50 86L55 80" stroke="#F43F5E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Parabolic Strobe Trajectory Dots -->
  <circle cx="62" cy="30" r="3.5" fill="#A855F7"/>
  <circle cx="76" cy="34" r="3.5" fill="#A855F7"/>
  <circle cx="89" cy="45" r="3.5" fill="#A855F7"/>
  <circle cx="100" cy="64" r="4" fill="#FDE047" stroke="#A855F7" stroke-width="2"/>
</svg>
